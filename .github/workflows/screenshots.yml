name: Screenshots

# Screenshots of the main screens on the iPhone simulator, in Greek and English,
# light and dark, and a video of the app starting (the splash), so a change to
# the screens can be looked at in the pull request.
#
#   - "screenshots" (Artifacts): the PNGs and splash.mp4
#
# It takes several minutes, so it runs only when the screens, the resources or
# the script change, and from the Actions tab (Run workflow).
#
# On main it also puts the new screenshots in docs/screenshots, the ones the
# README and the organisation's site show, so they follow the app. Same file
# names every time, so links to them keep working.

on:
  pull_request:
    paths:
      - App/Sources/UI/**
      - App/Sources/App/**
      - App/Resources/**
      - scripts/screenshots.sh
      - .github/workflows/screenshots.yml
  push:
    branches: [main]
    paths:
      - App/Sources/UI/**
      - App/Sources/App/**
      - App/Resources/**
      - scripts/screenshots.sh
      - .github/workflows/screenshots.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - name: Make the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick a simulator
        id: sim
        run: echo "udid=$(scripts/pick-simulator.sh)" >> "$GITHUB_OUTPUT"

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project AstikaKastorias.xcodeproj -scheme AstikaKastorias \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO | grep -E "error:|\*\* " || true
          test -d build/sim/Build/Products/Debug-iphonesimulator/AstikaKastorias.app

      - name: Screenshots
        timeout-minutes: 25
        run: scripts/screenshots.sh "${{ steps.sim.outputs.udid }}" build/sim screenshots

      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore

      - name: Update docs/screenshots
        if: github.ref == 'refs/heads/main'
        run: |
          # 430 px wide is plenty for a page, and keeps the repo small
          for f in screenshots/*.png; do
            sips --resampleWidth 430 "$f" --out "docs/screenshots/$(basename "$f")" > /dev/null
          done
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "The screenshots haven't changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update the screenshots"
          git pull --rebase -q origin main
          git push origin HEAD:main
